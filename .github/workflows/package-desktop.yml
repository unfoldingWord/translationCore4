name: package-desktop

# #57: produce an unsigned desktop artifact on every merge to main, and on
# pull requests that touch the packaging recipe — PR artifacts upload too
# (short retention), so a packaging fix can be downloaded and taken through
# the real Gatekeeper path BEFORE merge (PR #98 review). The recipe lives in
# scripts/package-desktop.zsh. The script smoke-tests the staged artifact
# THROUGH ITS OWN ENTRY POINT (self-spawned server; root 303 ->
# /clients/uw-tc4, then 200) before it zips.
#
# Owner ruling 2026-09-08 (after PR #226): a pull request builds only when it
# changes the recipe itself — the two scripts, this workflow, or the server
# crate. A change to the app (src/, public/, rig/, package.json, vite config)
# is proven by the `ci` and `rig` workflows on the PR and packaged on merge;
# three desktop builds per app PR cost more time than they caught.
#
# #119 adds the linux-x64 job beside the proven macos-arm64 one. Both run the
# same script; only the host differs. #181 adds windows-x64: the same script
# again, under MSYS2's zsh on a Windows runner. Signed/notarized installers
# remain #44's.
#
# #45 adds one smoke-* job per platform: a FRESH runner downloads the artifact the
# build job uploaded, unpacks it once, and runs the shipped post-install smoke test
# (smoke-installed.zsh) under a fresh HOME. A fresh runner is a clean machine; the
# job log is the pasteable evidence the tag rule wants (epic #59).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/package-desktop.zsh
      - scripts/smoke-installed.zsh
      - .github/workflows/package-desktop.yml
      - dev-env/server/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-env/server/target
          key: cargo-package-desktop-${{ runner.os }}-${{ hashFiles('dev-env/server/Cargo.lock', 'dev-env/server/Cargo.toml') }}

      - name: Build the artifact
        run: zsh scripts/package-desktop.zsh

      # Single-layer download (#119): `archive: false` uploads the zip as one file, so the
      # download IS that zip and the execute bits inside survive. The action then ignores
      # `name` and names the artifact after the file: tC4-<version>-macos-arm64-unsigned.zip.
      # (The action's own archive normalizes what it packs to mode 644, which is why the
      # build zips first; v4 then wrapped that zip in its archive, and testers unpacked twice.
      # Evidence and citations: docs/PACKAGING.md, "What the pipeline does".)
      - name: Upload the artifact (merges to main — 30-day retention)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-desktop/tC4-*-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the artifact (pull requests — short retention, for pre-merge Gatekeeper testing)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-desktop/tC4-*-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 3

  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build and runtime dependencies
        run: |
          sudo apt-get update
          # zsh and zip: the packaging script's shell and its archiver.
          # pkg-config, libssl-dev, zlib1g-dev: openssl-sys and libgit2-sys
          #   link the system libraries — dev-env/server enables no vendored
          #   feature.
          # The remaining packages are Electron's shared libraries, plus xvfb:
          #   the smoke test starts the artifact through its own launcher, and
          #   Electronite opens a real window.
          sudo apt-get install -y --no-install-recommends \
            zsh zip xvfb \
            pkg-config libssl-dev zlib1g-dev \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 libatspi2.0-0t64 libgtk-3-0t64

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-env/server/target
          key: cargo-package-desktop-${{ runner.os }}-${{ hashFiles('dev-env/server/Cargo.lock', 'dev-env/server/Cargo.toml') }}

      - name: Build the artifact
        run: xvfb-run -a zsh scripts/package-desktop.zsh

      - name: Upload the smoke-test logs (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tc4-desktop-linux-x64-smoke-logs
          path: dist-desktop/smoke-*.log
          if-no-files-found: warn
          retention-days: 7

      # Single-layer download (#119): one file, `archive: false`; the artifact is named after
      # the file, tC4-<version>-linux-x64-unsigned.zip, and the execute bits inside survive.
      - name: Upload the artifact (merges to main — 30-day retention)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-desktop/tC4-*-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the artifact (pull requests — short retention; same name as the main build, #119)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-desktop/tC4-*-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 3

  # #181: the Windows x64 artifact. The same script runs under MSYS2's zsh
  # (preinstalled on the runner; setup-msys2 adds zsh, zip, unzip and curl and
  # keeps the Windows node, cargo and git on the PATH). The server builds with
  # the MSVC toolchain and needs no OpenSSL there (git2 uses WinHTTP, ureq uses
  # rustls). The smoke test opens a real window on the runner's desktop session.
  # There is no smoke-windows-x64 post-install job yet: the shipped
  # smoke-installed.zsh is macOS/Linux (docs/PACKAGING.md, "Windows x64").
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # Windows git defaults to core.autocrlf=true. A CRLF package-desktop.zsh does
      # not parse under zsh, and CRLF sample-burrito bytes would break the debug
      # seed. Check every file out as committed (Codex review round 1, PR #226).
      - name: Keep LF line endings on checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          path-type: inherit
          install: zsh zip unzip curl

      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-env/server/target
          key: cargo-package-desktop-${{ runner.os }}-${{ hashFiles('dev-env/server/Cargo.lock', 'dev-env/server/Cargo.toml') }}

      - name: Build the artifact
        shell: msys2 {0}
        run: zsh scripts/package-desktop.zsh

      - name: Upload the smoke-test logs (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tc4-desktop-windows-x64-smoke-logs
          path: dist-desktop/smoke-*.log
          if-no-files-found: warn
          retention-days: 7

      # Single-layer download (#119): one file, `archive: false`; the artifact is named after
      # the file, tC4-<version>-windows-x64-unsigned.zip. Permission bits do not apply.
      - name: Upload the artifact (merges to main — 30-day retention)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-desktop/tC4-*-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the artifact (pull requests — short retention; same name as the main build)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-desktop/tC4-*-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 3

  # #45 post-install smoke test, macOS: a fresh runner, the uploaded artifact, one unzip.
  smoke-macos-arm64:
    needs: macos-arm64
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      # actions/download-artifact extracts the zip itself and drops the execute bits
      # (run 34007702506: start-tc4 at mode 644, the smoke test refused it). A pilot's
      # browser download is the raw zip, so the job takes the same path: the API's raw
      # artifact zip, unpacked once with unzip (docs/PACKAGING.md, "Install and launch").
      - name: Download the artifact as a pilot does (raw zip, one unzip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name | test("^tC4-.*-macos-arm64-unsigned\\.zip$")) | .id')
          test -n "$ID"
          echo "artifact id: $ID"
          mkdir -p download
          gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > download/artifact.zip
          ls -la download
          shasum -a 256 download/artifact.zip || sha256sum download/artifact.zip

      - name: Unpack once
        run: |
          set -e
          unzip -q download/artifact.zip -d install
          ls -la install/translationCore4

      - name: Run the shipped smoke test under a fresh HOME
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-home" smoke-logs
          set -o pipefail
          TC4_SMOKE_HOME="$RUNNER_TEMP/smoke-home" TC4_SMOKE_LOGDIR="$PWD/smoke-logs" zsh install/translationCore4/smoke-installed.zsh install/translationCore4 2>&1 | tee smoke-logs/smoke-installed-macos-arm64.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-installed-macos-arm64
          path: smoke-logs/
          retention-days: 30

  # #45 post-install smoke test, Linux: the same, with Electron's shared libraries and xvfb.
  smoke-linux-x64:
    needs: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Runtime dependencies (what a pilot's desktop already has)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zsh unzip curl lsof xvfb \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 libatspi2.0-0t64 libgtk-3-0t64

      # actions/download-artifact extracts the zip itself and drops the execute bits
      # (run 34007702506: start-tc4 at mode 644, the smoke test refused it). A pilot's
      # browser download is the raw zip, so the job takes the same path: the API's raw
      # artifact zip, unpacked once with unzip (docs/PACKAGING.md, "Install and launch").
      - name: Download the artifact as a pilot does (raw zip, one unzip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name | test("^tC4-.*-linux-x64-unsigned\\.zip$")) | .id')
          test -n "$ID"
          echo "artifact id: $ID"
          mkdir -p download
          gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > download/artifact.zip
          ls -la download
          shasum -a 256 download/artifact.zip || sha256sum download/artifact.zip

      - name: Unpack once
        run: |
          set -e
          unzip -q download/artifact.zip -d install
          ls -la install/translationCore4

      - name: Run the shipped smoke test under a fresh HOME
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-home" smoke-logs
          set -o pipefail
          TC4_SMOKE_HOME="$RUNNER_TEMP/smoke-home" TC4_SMOKE_LOGDIR="$PWD/smoke-logs" xvfb-run -a zsh install/translationCore4/smoke-installed.zsh install/translationCore4 2>&1 | tee smoke-logs/smoke-installed-linux-x64.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-installed-linux-x64
          path: smoke-logs/
          retention-days: 30
