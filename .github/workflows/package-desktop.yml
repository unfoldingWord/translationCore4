name: package-desktop

# #57: produce an unsigned desktop artifact on every merge to main (one OS),
# and on pull requests that touch the packaging inputs — PR artifacts upload
# too (short retention), so a packaging fix can be downloaded and taken
# through the real Gatekeeper path BEFORE merge (PR #98 review). The recipe
# lives in scripts/package-desktop.zsh. #44 extends this workflow with more
# OSes and signing. The script smoke-tests the staged artifact THROUGH ITS
# OWN ENTRY POINT (self-spawned server; root 303 -> /clients/uw-tc4, then
# 200) before it zips.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/package-desktop.zsh
      - .github/workflows/package-desktop.yml
      - src/**
      - public/**
      - rig/**
      - dev-env/server/**
      - package.json
      - package-lock.json
      - vite.config.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dev-env/server/target
          key: cargo-package-desktop-${{ runner.os }}-${{ hashFiles('dev-env/server/Cargo.lock', 'dev-env/server/Cargo.toml') }}

      - name: Build the artifact
        run: zsh scripts/package-desktop.zsh

      - name: Upload the artifact (merges to main — 30-day retention)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tc4-desktop-macos-arm64-unsigned
          path: dist-desktop/tC4-*-unsigned.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload the artifact (pull requests — short retention, for pre-merge Gatekeeper testing)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tc4-desktop-macos-arm64-unsigned-pr
          path: dist-desktop/tC4-*-unsigned.zip
          if-no-files-found: error
          retention-days: 3
