# The weekly pin check (#504). The build bundles the English suite at fixed releases
# (scripts/package-desktop.zsh, BUNDLED_RESOURCES). This workflow compares every tagged
# pin with the latest production release in the Door43 catalog (scripts/pin-check.mjs).
# When a pin is behind, it opens one issue, or updates the open one. When every pin is
# current, it does nothing.
#
# Owner decision (2026-10-01, #504): fixed pins plus a scheduled check, not a lookup at
# build time. The check runs on a schedule and on demand only: it adds no time to the
# pull-request or push CI, so it has no `pull_request` or `push` trigger.
#
# Negative control: `workflow_dispatch` with `override` set to `<owner>/<repo>:<old tag>`
# (for example `unfoldingWord/en_ult:v89`) must report that pin. A run on the real pins
# with every pin current reports nothing. A control run uses its own issue title, so it
# never edits a real "behind" issue; close the control issue after the run id is recorded.
#
# Least privilege: the job reads the repository and writes issues, nothing else.
# ⛔ Read-only against Door43. Never a pankosmia remote, token, or upstream trigger.
name: pin-check
permissions:
  contents: read
  issues: write
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      override:
        description: 'Negative control: check with ONE pin replaced, as <owner>/<repo>:<tag> (for example unfoldingWord/en_ult:v89). Leave empty to check the real pins.'
        type: string
        required: false
        default: ''

jobs:
  pin-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The script exits 1 when a catalog lookup fails or answers with no release: that
      # is a red run, not a report. Only a compared difference sets `behind=true`.
      - name: Compare the pins with the Door43 catalog
        id: check
        env:
          OVERRIDE: ${{ inputs.override }}
        run: |
          set -o pipefail
          node scripts/pin-check.mjs --override "$OVERRIDE" --out "$RUNNER_TEMP/pin-check.json" --body "$RUNNER_TEMP/pin-check-body.md" | tee "$RUNNER_TEMP/pin-check.txt"
          { echo '```'; cat "$RUNNER_TEMP/pin-check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the issue, or update the open one
        if: steps.check.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.override }}
        run: |
          # A negative-control run (override set) gets its own title: it must never edit the real issue.
          if [ -n "$OVERRIDE" ]; then TITLE="Negative control of the weekly pin check"; else TITLE="Bundled resource pins are behind the latest Door43 releases"; fi
          NUMBER=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pin-check-body.md"
            echo "updated issue #$NUMBER"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/pin-check-body.md"
          fi

      - name: Every pin is current
        if: steps.check.outputs.behind != 'true'
        run: echo "every tagged pin is the latest Door43 release; nothing to report"
