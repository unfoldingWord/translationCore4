name: Task
description: A work item with measurable acceptance criteria and an exact verify command.
title: "Plain imperative title a stranger understands (legacy IDs go in the body)"
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Write for someone who has never read the project documents. Plain sentences:
        what is true now, why this item exists, why it matters. Spell out every internal
        ID (D-numbers, FR-nn, legacy IDs) in words, and make each reference a LINK —
        to docs/DECISIONS.md, docs/LEGACY-IDS.md, or the file it names. Never cite an
        internal or private document path.
      placeholder: |
        When the app downloads a resource it never checks the file names inside the
        archive, so a crafted name like ../../x could write outside its folder
        (defence-in-depth; the download is already tied to a verified git commit —
        see the decision log, D34: <link>).
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Platform reuse
      description: >-
        What Pankosmia or the pinned uW libraries (usfm-js, word-aligner,
        word-aligner-lib, bible-reference-range, string-punctuation-tokenizer) already do
        for this item, with a LINK to each file or function. If nothing does it, say what
        you searched. The builder uses what exists behind our own interface (AGENTS.md,
        "Look at Pankosmia before you write code").
      placeholder: |
        The Pankosmia checking client exports aligned USFM with word-aligner-lib's
        AlignmentHelpers.addAlignmentsToTargetVerseUsingMerge:
        https://github.com/pankosmia/uw-client-checks/blob/main/src/pages/UsfmExport.jsx
        Use the same helper. Do not copy its write back into the project (I-1).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Measurable statements. Each one is true or false after the work — no "improve" or "better".
      placeholder: |
        - [ ] The preflight lists each missing resource before the first download starts.
        - [ ] A cancelled preflight leaves no partial files on disk.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: The exact command and the expected output. "Done" means this command passes with pasted evidence.
      placeholder: |
        Command: npm run verify, then npm run journeys -- e2e/j03-get-resources.spec.ts
        Expected: lint, typecheck, tests and build pass; the named journey passes and writes its artifact.
      render: text
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files
      description: Where the change probably lands. Best guess is fine.
      placeholder: |
        src/data/resourceFetch.ts
        e2e/j03-get-resources.spec.ts
    validations:
      required: false
  - type: textarea
    id: decisions
    attributes:
      label: Related decisions
      description: D-numbers from docs/DECISIONS.md that bind this item. A recorded decision is not open for re-proposal.
      placeholder: D34, D37
    validations:
      required: false
  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Issues that must close first, and environment needs (add the needs-rig label if the Pankosmia rig is required).
      placeholder: "Blocked by #12. Needs the local rig (needs-rig)."
    validations:
      required: false
