# The gate's Rust tests run through cargo-nextest (scripts/gates.sh, CHK-8): a test still running
# after 60 s is named SLOW in the log, and after 5 periods it is stopped and named TIMEOUT, so a
# hung test costs 5 minutes, not the job's whole limit.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

# Longer limits only for tests whose measured time needs one (CHK-8: a local run at 4 threads,
# and CI's libtest times). Each still stops, and SLOW names it every minute.

# tc-api's two round-trip property tests: 210 s to past 516 s locally as the load varied; their
# binary took 502 s on CI (run 40356855830).
[[profile.default.overrides]]
filter = 'binary_id(tc-api::roundtrip)'
slow-timeout = { period = "60s", terminate-after = 20 }

# A crash at every write of a scenario project: 190 to 277 s locally when measured; 675 s by
# itself and past 900 s in a gate at four threads on 2026-10-26, with other sessions' builds
# loading the machine (load 7 to 11).
[[profile.default.overrides]]
filter = 'binary_id(tc-app::app) & test(=app::store_scenario::a_crash_while_a_scenario_project_is_written_leaves_no_half_project)'
slow-timeout = { period = "60s", terminate-after = 20 }

# tc-store's crash matrices on Windows: every row copies and reopens a git repository, about
# 1500 file operations a row, and a file operation takes 0.5 to 1 ms on the Windows VM and about
# 0.01 ms on Linux. Alone on the VM (2026-11-02) they ran 65 to 146 s, against 15 to 25 s on
# Linux; at four at a time on CI they ran 236 to 299 s or past the 300 s limit every night
# (nightly runs 41056760740 to 41471937444). They are slow, not hung: SLOW names each every
# minute and each still stops.
[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'binary_id(tc-store::store) & (test(=crash::crash_checkpoint_into_a_months_folder_that_does_not_exist_yet) | test(=crash::crash_whole_project_materialize_group_by_group) | test(=crash::crash_materialize_ledger_tells_its_bytes_from_an_outside_edit) | test(=crash::crash_materialize_with_a_carried_file_and_a_held_file) | test(=kept::crash_at_every_write_point_of_an_import_imports_once) | test(=model::random_histories_lose_no_work) | test(=salvage_sources::every_salvage_open_crash_keeps_exact_history_and_the_complete_damaged_image) | test(=intake::crash_intake_folds_whole_batches_only_and_commits_on_retry) | test(=reflow::crash_a_verse_save_and_its_reflow_are_one_batch))'
slow-timeout = { period = "60s", terminate-after = 10 }

# tc-server's never_blocked reads how late a timer wakes, which other tests running at once spoil:
# libtest ran its binary alone and its two tests one at a time (a static lock that cannot reach
# across nextest's processes).
[[profile.default.overrides]]
filter = 'binary_id(tc-server::never_blocked)'
threads-required = 'num-test-threads'
