[package]
name = "tc4_dev_server"
version = "0.1.0"
edition = "2021"
# Thin launch shim over the pankosmia_web crate (same pattern as the desktop-app
# template's local_server). Pinned by git rev to 0.18.15 (a83725b) [decided 2026-10-03
# — owner, #461]. crates.io publishes 0.18.15 from the same commit (.cargo_vcs_info.json
# of the published crate, read 2026-10-03). The pin stays a rev pin because
# scripts/prove.mjs reads the build revision from this line.
[dependencies]
pankosmia_web = { git = "https://github.com/pankosmia/pankosmia-web.git", rev = "a83725b67593b018f815fdb25a3920ce03e833e7" }
rocket = { version = "0.5.1", features = ["json"] }
serde_json = "1.0"

# A pilot Mac has no Homebrew. Unify the existing git2 dependency's features so
# libgit2 and its OpenSSL dependency are built into the packaged server (#243).
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { version = "0.20.4", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
