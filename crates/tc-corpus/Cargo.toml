[package]
name = "tc-corpus"
description = "The deterministic scale corpus of docs/PERFORMANCE.md: real Psalms data and a whole Bible generated from it, as journal changes and as plain domain inputs. For tests and benchmarks only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tc-core = { path = "../tc-core" }
tc-usfm = { path = "../tc-usfm" }
tc-burrito = { path = "../tc-burrito" }
tc-journal = { path = "../tc-journal" }
tc-versification = { path = "../tc-versification" }
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
# shabench compares the two SHA-256 implementations on the corpus.
ring.workspace = true
sha2.workspace = true
# foldbench reads files on the worker pool the fold itself uses, as an open does.
rayon.workspace = true
# The capsule generator and the capsule tests (docs/STORAGE.md §12.3, #865) write and open
# sample projects through the real store, exchange them by file, and seed an OBS project.
tc-store = { path = "../tc-store", features = ["test-hooks"] }
tc-sync = { path = "../tc-sync" }
tc-obs = { path = "../tc-obs" }
# A teammate's carried file is a blob in the project's object database, as a receive leaves it.
git2.workspace = true
# The exchange by file is async.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tempfile.workspace = true

[lints]
workspace = true
